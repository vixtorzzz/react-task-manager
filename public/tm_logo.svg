<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Definição de Gradientes e Efeitos -->
  <defs>
    <!-- Gradiente de Fundo do Ícone (Azul Escuro / Azul Noturno) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#1B2B4A" />
    </linearGradient>

    <!-- Gradiente do Sinal de Concluído (Verde / Turquesa Vibrante) -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado (Opção de App Icon ou Logo de Marca) -->
  <rect width="90" height="90" x="5" y="5" rx="20" fill="url(#bgGrad)" />

  <!-- Prancheta / Corpo Principal -->
  <rect width="46" height="58" x="27" y="22" rx="6" fill="none" stroke="#FFFFFF" stroke-width="4.5" />

  <!-- Clipe de Metal Superior -->
  <path d="M 42 22 L 42 18 C 42 16, 58 16, 58 18 L 58 22 Z" fill="#94A3B8" />
  <circle cx="50" cy="18" r="2.5" fill="#334155" />

  <!-- Linha de Check 1 (Concluída) -->
  <!-- O "Visto" / "Check" -->
  <path d="M 33 39 L 36 42 L 41 36" fill="none" stroke="url(#checkGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Linhas do Texto -->
  <line x1="47" y1="38.5" x2="63" y2="38.5" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" />

  <!-- Linha de Check 2 (Em Progresso / Pendente) -->
  <!-- O "Checkbox" Vazio -->
  <rect width="7" height="7" x="32" y="47.5" rx="1.5" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <!-- Linhas do Texto -->
  <line x1="43.5" y1="51" x2="57.5" y2="51" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />

  <!-- Linha de Check 3 (Em Progresso / Pendente) -->
  <!-- O "Checkbox" Vazio -->
  <rect width="7" height="7" x="32" y="59.5" rx="1.5" fill="none" stroke="#64748B" stroke-width="2.5" />
  <!-- Linhas do Texto -->
  <line x1="43.5" y1="63" x2="52.5" y2="63" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
</svg>